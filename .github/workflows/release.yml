name: Release assets

run-name: Build assets for ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      cli_asset: ${{ steps.release.outputs.cli_asset }}
      desktop_asset: ${{ steps.release.outputs.desktop_asset }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "::error::Release tag must use v<SemVer>, got $tag"
            exit 1
          fi

          version="${tag#v}"
          core_and_prerelease="${version%%+*}"
          if [[ "$core_and_prerelease" == *-* ]]; then
            prerelease="${core_and_prerelease#*-}"
            IFS='.' read -r -a identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && \
                    "$identifier" != "0" && \
                    "$identifier" == 0* ]]; then
                echo "::error::Numeric prerelease identifiers cannot have leading zeroes: $identifier"
                exit 1
              fi
            done
          fi

          commit="$(git rev-list -n 1 "$tag")"
          git fetch --no-tags origin \
            "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $tag does not point to a commit on $DEFAULT_BRANCH"
            exit 1
          fi

          source_date_epoch="$(git show -s --format=%ct "$commit")"
          build_date="$(date -u -d "@$source_date_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'build_date=%s\n' "$build_date"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'cli_dir=opsdoctor_%s_Linux_x86_64\n' "$version"
            printf 'cli_asset=opsdoctor_%s_Linux_x86_64.tar.gz\n' "$version"
            printf 'desktop_asset=opsdoctor-desktop_%s_Linux_x86_64.tar.gz\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            make \
            pkg-config \
            xorg-dev \
            xz-utils

      - name: Install pinned Fyne packaging tool
        env:
          GOBIN: ${{ runner.temp }}/release-tools
        run: |
          mkdir -p "$GOBIN"
          go install fyne.io/tools/cmd/fyne@v1.7.2

      - name: Build release binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          BUILD_DATE: ${{ steps.release.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: |
          make build \
            VERSION="$VERSION" \
            COMMIT="$COMMIT" \
            BUILD_DATE="$BUILD_DATE" \
            MODIFIED=false
          ./bin/opsdoctor version --json

      - name: Package release assets
        env:
          CLI_DIR: ${{ steps.release.outputs.cli_dir }}
          CLI_ASSET: ${{ steps.release.outputs.cli_asset }}
          DESKTOP_ASSET: ${{ steps.release.outputs.desktop_asset }}
          FYNE_PACKAGE_TOOL: ${{ runner.temp }}/release-tools/fyne
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: |
          set -euo pipefail

          mkdir -p dist
          cli_stage="$RUNNER_TEMP/$CLI_DIR"
          mkdir -p "$cli_stage"
          install -m 0755 bin/opsdoctor "$cli_stage/opsdoctor"
          install -m 0644 LICENSE README.md "$cli_stage/"
          tar \
            --sort=name \
            --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C "$RUNNER_TEMP" \
            "$CLI_DIR" \
            | gzip -n > "dist/$CLI_ASSET"

          ./scripts/package-desktop.sh \
            linux \
            bin/opsdoctor-desktop \
            "dist/$DESKTOP_ASSET"

          desktop_stage="$RUNNER_TEMP/desktop-stage"
          mkdir -p "$desktop_stage"
          tar -xzf "dist/$DESKTOP_ASSET" -C "$desktop_stage"
          tar \
            --sort=name \
            --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C "$desktop_stage" \
            . \
            | gzip -n > "dist/$DESKTOP_ASSET"

          (
            cd dist
            sha256sum "$CLI_ASSET" "$DESKTOP_ASSET" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Preserve release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Attach assets to manual release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Restore release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify restored assets
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Wait for manually created release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            if gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              >/dev/null 2>&1; then
              exit 0
            fi

            if [ "$attempt" -lt 40 ]; then
              echo "Release $TAG is not available yet; waiting 15 seconds."
              sleep 15
            fi
          done

          echo "::error::Create the GitHub Release for $TAG manually, then rerun this workflow."
          exit 1

      - name: Upload assets without changing release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          CLI_ASSET: ${{ needs.build.outputs.cli_asset }}
          DESKTOP_ASSET: ${{ needs.build.outputs.desktop_asset }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local depth object object_sha object_type

            object="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '[.object.type, .object.sha] | @tsv'
            )"
            for ((depth = 0; depth < 5; depth++)); do
              object_type="${object%%$'\t'*}"
              object_sha="${object#*$'\t'}"
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  object="$(
                    gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                      --jq '[.object.type, .object.sha] | @tsv'
                  )"
                  ;;
                *)
                  echo "Unsupported tag target type: $object_type" >&2
                  return 1
                  ;;
              esac
            done

            echo "Tag indirection is too deep for $TAG" >&2
            return 1
          }

          for asset in \
            "dist/$CLI_ASSET" \
            "dist/$DESKTOP_ASSET" \
            dist/SHA256SUMS.txt
          do
            current_commit="$(resolve_tag_commit)"
            if [ "$current_commit" != "$EXPECTED_COMMIT" ]; then
              echo "::error::Tag $TAG moved after the assets were built."
              exit 1
            fi

            name="$(basename "$asset")"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            remote_asset="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                --jq ".assets[] | select(.name == \"$name\") | [.id, .digest] | @tsv"
            )"

            if [ -n "$remote_asset" ]; then
              remote_digest="${remote_asset#*$'\t'}"
              if [ "$remote_digest" = "$local_digest" ]; then
                echo "$name is already attached with the expected digest."
                continue
              fi

              echo "::error::Release asset $name already exists with a different digest."
              exit 1
            fi

            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done

          current_commit="$(resolve_tag_commit)"
          if [ "$current_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Tag $TAG moved while assets were being uploaded."
            exit 1
          fi
