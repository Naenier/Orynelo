name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            xorg-dev

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy -diff

      - name: Check source
        run: |
          make fmt-check
          make vet

      - name: Run tests
        run: go test -tags="integration wayland migrated_fynedo" ./...

      - name: Build applications
        run: |
          make build
          ./bin/opsdoctor version --json
